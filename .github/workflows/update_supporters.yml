name: Update Supporters

on:
  schedule:
    - cron: '0 8 * * *'  # Runs daily at midnight PST (8:00 AM UTC)
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

jobs:
  update-supporters:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: pip install requests beautifulsoup4 pytz

    - name: Run update script
      run: python scripts/update_supporters.py

    - name: Commit and push if changed
      id: commit
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add index.html data/
        if git diff --staged --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "Auto-update supporters list"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Build Site
      if: steps.commit.outputs.changed == 'true'
      run: bash scripts/build_site.sh

    - name: Deploy to GitHub Pages
      if: steps.commit.outputs.changed == 'true'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: _site
        branch: gh-pages
        clean: true
        clean-exclude: pr-preview
        force: false
